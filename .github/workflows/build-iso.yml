name: Build macOS ISO
on:
  workflow_dispatch:
    inputs:
      target:
        description: '关键匹配词，例如 macOS Sonoma'
        required: true
        default: 'macOS Sonoma'
      version:
        description: '优先尝试的版本，例如 14.8.4；留空取最新'
        required: false
        default: '14.8.9'
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 340
    steps:
      - name: 0. Runner info + cleanup
        run: |
          set -x
          sw_vers
          uname -m
          df -h /
          sudo rm -rf /Applications/Xcode*.app /Library/Developer/CoreSimulator /Library/Developer/Xcode/DerivedData /Users/runner/Library/Developer ~/Library/Developer 2>/dev/null || true
          df -h /

      - name: 1. List installers offered
        run: |
          softwareupdate --list-full-installers 2>&1 | tee /tmp/list.txt || true

      - name: 2. Fetch installer
        id: fetch
        run: |
          set -uo pipefail
          WANT="${{ inputs.version }}"
          APP=""
          mkdir -p /tmp/out
          available() { grep -i "${{ inputs.target }}" /tmp/list.txt | grep -oiE '[0-9]+\.[0-9]+(\.[0-9]+)?' | sort -V | tail -1; }

          try_su() {
            v="$1"; [ -z "$v" ] && return 1
            echo ">>> softwareupdate try $v"
            sudo softwareupdate --fetch-full-installer --full-installer-version "$v" || return 1
            APP=$(ls -d /Applications/Install\ macOS*.app 2>/dev/null | head -1)
            [ -n "$APP" ]
          }

          try_mist() {
            v="$1"
            echo ">>> mist try ${v:-latest}"
            brew install mist-cli >/dev/null 2>&1 || brew install misterio/mist/mist-cli >/dev/null 2>&1 || return 1
            if [ -n "$v" ]; then
              mist download installer "$v" /tmp/out --type app --no-progress || return 1
            else
              mist download installer "${{ inputs.target }}" /tmp/out --type app --no-progress || return 1
            fi
            APP=$(find /tmp/out /Applications -maxdepth 3 -name "Install macOS*.app" 2>/dev/null | head -1)
            [ -n "$APP" ]
          }

          if try_su "$WANT"; then echo "OK su $WANT";
          elif try_mist "$WANT"; then echo "OK mist $WANT";
          else
            LATEST=$(available); echo ">>> fallback latest: $LATEST"
            if try_su "$LATEST"; then echo "OK su $LATEST";
            elif try_mist "$LATEST"; then echo "OK mist $LATEST";
            else echo "ALL FAILED"; exit 1; fi
          fi
          echo "APP=$APP"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          du -sh "$APP"
          df -h /

      - name: 3. createinstallmedia
        run: |
          set -euo pipefail
          APP="${{ steps.fetch.outputs.app }}"
          rm -f /tmp/media.dmg
          hdiutil create -o /tmp/media -size 20g -layout SPUD -fs HFS+J
          hdiutil attach /tmp/media.dmg -noverify -mountpoint /Volumes/mediasrc
          sudo "$APP/Contents/Resources/createinstallmedia" --volume /Volumes/mediasrc --nointeraction
          sync
          for v in /Volumes/Install*; do hdiutil detach "$v" -force || true; done
          hdiutil resize -limits /tmp/media.dmg
          MIN=$(hdiutil resize -limits /tmp/media.dmg | tail -1 | awk '{print $1}')
          hdiutil resize -sectors $((MIN+20480)) /tmp/media.dmg
          hdiutil resize -limits /tmp/media.dmg
          df -h /

      - name: 4. ISO
        run: |
          set -euo pipefail
          sudo rm -rf /Applications/Install\ macOS*.app /tmp/out || true
          df -h /
          hdiutil convert /tmp/media.dmg -format UDTO -o /tmp/macOS
          mv /tmp/macOS.cdr /tmp/macOS.iso
          ls -lh /tmp/macOS.iso
          file /tmp/macOS.iso
          shasum -a 256 /tmp/macOS.iso | tee /tmp/macOS.iso.sha256
          df -h /

      - name: 5. split
        run: |
          set -euo pipefail
          split -b 1900m -d -a 2 /tmp/macOS.iso /tmp/part_
          rm -f /tmp/macOS.iso
          ls -lh /tmp/part_*
          du -ch /tmp/part_* | tail -1

      - name: 6. release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="iso-$(date +%Y%m%d%H%M)"
          gh release create "$TAG" /tmp/part_* /tmp/macOS.iso.sha256 --repo "${{ github.repository }}" --title "macOS ISO $TAG" --notes "parts + sha256"
          echo "TAG=$TAG"
